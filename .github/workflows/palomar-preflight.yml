name: Palomar mechanical preflight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@c02bbeaed888df45c4e28c4e99dba540ad21552a
    with:
      repository: jtraverso/galvin-dinitz
      commit: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
      pipeline_commit: c02bbeaed888df45c4e28c4e99dba540ad21552a
      request_id: galvinmulti1
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path": "comparator.json", "authorization_relationship": "I am a responsible author or maintainer"}'
