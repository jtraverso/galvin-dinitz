version: "v0.4"

project:
  name: "Galvin's theorem, the Dinitz problem and stable matchings"
  description: >-
    A Lean 4 / Mathlib formalization of Galvin's theorem that the list chromatic index of a finite
    bipartite graph equals its maximum degree (if every edge has a list of at least Δ colours, a
    proper edge colouring can be chosen from the lists), of its corollary solving the Dinitz
    problem (an n × n array with lists of n symbols per cell admits a choice with distinct symbols
    in every row and column), and of the Gale–Shapley theorem on the existence of stable matchings
    with strict preferences and incomplete acceptability lists, which provides the kernels in
    Galvin's argument. Mathlib has line graphs and colourings but none of these results.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C15", "05C70", "91B68"]

sources:
