status:
  scope: 'Nine compared theorems: the three retained simple-graph/stable-matching/Dinitz results, plus
    six multigraph results in GalvinMultigraph. Multigraphs are represented by finite edge identifiers
    and endpoint maps to the two finite sides. No endpoint-pair injectivity is assumed. Degrees count
    identifiers with multiplicity. Lists are finite sets over any color type. Empty edge sets, empty
    sides and zero maximum degree are included. No full coverage of every assertion in the source papers
    is claimed. The sorry counts refer to Solution proofs; Challenge has nine intentional theorem placeholders
    and no definition holes.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: autonomous
    models:
    - Aristotle (Harmonic)
    framework: Aristotle CLI
    tool_setup: Produced all proofs in one run from the formal statements and a proof plan (Gale–Shapley,
      kernel lemma, Galvin's orientation from a Kőnig colouring, Dinitz via K_{n,n}) on top of the existing
      Kőnig library; the return was audited (statements and headers unchanged, libraries unchanged,
      no added axioms) and rebuilt locally.
    cost:
      wall_time: about one hour
      spend_usd: not tracked
      hardware: API-only
    prompting_notes: Formal statements and proof plan supplied.
  - method: agent
    models:
    - Claude Opus 5.5
    framework: Claude Code (Anthropic)
    tool_setup: Statement design, proof plan, integration and review of the Aristotle return, and the
      Palomar packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
    cost:
      wall_time: about one hour
      spend_usd: subscription-based
      hardware: local machine
    prompting_notes: Natural-language instructions in Spanish, directed by the author.
  - method: agent
    framework: OpenAI Codex
    tool_setup: Developed the multigraph gadget reduction and all new Lean proofs, preserved and rebuilt
      the existing proof bodies, extended the independent Challenge and Comparator selection, and ran
      axiom audits, boundary cases, and sandboxed Lean/NanoDa checks. No new Aristotle run was performed
      for this extension.
    prompting_notes: Spanish natural-language instructions from the author; the next item in the effort-prioritized
      backlog.
  notes: The results were chosen by the human author; the Lean proofs are AI-generated and mechanically
    verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound, identical elaborated
    types for the Challenge/Solution pair). The first two method entries describe the inherited version-1
    development and its reported costs. OpenAI Codex wrote the extension; its costs and exact model
    identifier are not asserted.
fidelity:
  divergences: 'For the multigraph extension, edges are distinct identifiers e : E with endpoints a
    e : A and b e : B, understood in the disjoint vertex union A ⊕ B. The maps need not be injective,
    so parallel edges are retained and loops excluded. Incidence degrees are Nat.card of endpoint fibers;
    all compared uses assume finite E. Proper requires distinct incident edges to receive distinct colors.
    maxDegree is the maximum over both finite sides and is zero on empty edge sets. The general degree-bound
    theorem assumes only finite A, B and E; the explicit maximum-degree interface carries enumerations
    of the two sides. The proof reduces to the existing simple theorem via K_{k,k} minus an edge, with
    lists shrunk to k colors; it is not a direct transcription of the original multigraph argument.
    The empty-edge case is handled separately. The lower bound and coloring equivalence express the
    optimal threshold without a separate numerical list-chromatic-index definition. The three original
    interfaces are retained unchanged in type. No custom axioms or additional hypotheses on edge multiplicity
    are introduced.'
review:
  status: self-assessed
  reviewers:
  - OpenAI Codex (self-assessment of the extension)
  notes: The same session that wrote the multigraph extension checked its statements, compiled all proof
    libraries without warnings, ran boundary examples including distinct parallel edges that cannot
    share one color, and ran Comparator over all nine declarations with Lean and NanoDa acceptance.
    This is not independent review. No independent human mathematical review of the extension has been
    performed. The original metadata reports Claude Code review of the inherited version-1 development;
    that does not constitute a separate review of the extension. No mathematical novelty or formalization
    priority is claimed.
