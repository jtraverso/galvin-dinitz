status:
  scope: "Proved for every finite simple graph, every n, and all finite preference instances."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced all proofs in one run from the formal statements and a proof plan (Gale–Shapley,
        kernel lemma, Galvin's orientation from a Kőnig colouring, Dinitz via K_{n,n}) on top of
        the existing Kőnig library; the return was audited (statements and headers unchanged,
        libraries unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "about one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, proof plan, integration and review of the Aristotle return, and the
        Palomar packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3,
        Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound,
    identical elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    Bipartiteness is `G.Colorable 2`; a proper list edge colouring is a colouring of Mathlib's
    `SimpleGraph.lineGraph` with values in the lists, which are finsets indexed by the edges.
    Galvin's theorem is formalized for simple graphs only (the original covers multigraphs). In
    the Gale–Shapley statement, preferences are injective rank functions `M → W → ℕ` and
    `W → M → ℕ` (smaller is better), matchings are relations contained in E that are injective in
    both directions, and stability says every acceptable pair outside the matching is blocked by
    one of its two members being matched to a partner it prefers. The Dinitz statement is phrased
    directly for an n × n array of finsets.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with the cited theorems, checked the encoding of stability and of
    proper list edge colourings, checked that the Aristotle return left every statement and
    header and the reused libraries unchanged, and confirmed by `lake build`, `#print axioms` and
    a comparison of the fully elaborated Challenge and Solution types that the proofs use no
    `sorry` and only propext, Classical.choice and Quot.sound. The author directed the work and
    approved the statements. No independent human mathematical review has been performed. The
    results are classical; no mathematical novelty is claimed.

