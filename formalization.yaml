version: v0.4
project:
  name: Galvin's theorem for bipartite multigraphs, the Dinitz problem and stable matchings
  description: 'A Lean 4 / Mathlib formalization of Galvin’s theorem for finite bipartite multigraphs:
    every assignment of finite edge lists of size at least the maximum incidence degree admits a proper
    edge coloring, with parallel edges counted separately. It includes ordinary edge coloring with Δ
    colors and the matching lower bound. The previously registered simple-graph Galvin theorem, Dinitz
    problem and Gale–Shapley stable matching theorem are retained.'
  authors:
  - Juan Pablo Traverso Gianini
  license: Apache-2.0
  responsible_maintainers:
  - Juan Pablo Traverso Gianini
classification:
  arxiv:
  - math.CO
  msc2020:
  - 05C15
  - 05C70
  - 91B68
sources:
- title: The List Chromatic Index of a Bipartite Multigraph
  authors:
  - F. Galvin
  id: doi:10.1006/jctb.1995.1011
  type: paper
  location: Journal of Combinatorial Theory, Series B 63 (1995), 153–158
  relationship: formalizes
  note: Galvin’s finite bipartite multigraph list-edge-coloring theorem, its simple-graph case and the
    Dinitz consequence. The multigraph extension is derived by a palette-synchronizing simple-graph
    gadget reduction to the previously formalized simple case, rather than by transcribing the paper’s
    proof.
  license: all rights reserved
  author_endorsement: n/a
- title: College Admissions and the Stability of Marriage
  authors:
  - D. Gale
  - L. S. Shapley
  id: doi:10.1080/00029890.1962.11989827
  type: paper
  location: The American Mathematical Monthly 69 (1962), 9–15
  relationship: formalizes
  note: Existence of stable matchings (here with incomplete acceptability relations).
  license: all rights reserved
  author_endorsement: n/a
